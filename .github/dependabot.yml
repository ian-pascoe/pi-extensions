version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
    ignore:
      # Vite+ pins its toolchain in places Dependabot cannot update together (mise.toml, the
      # pnpm-workspace.yaml overrides, pi-dap's vitest). Upgrade them by hand; see ADR 0012.
      - dependency-name: vite-plus
      - dependency-name: vitest
      - dependency-name: "@voidzero-dev/vite-plus-core"
