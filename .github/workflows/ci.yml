name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NO_UPDATE_NOTIFIER: "1"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          runtime: node@22.19.0
          cache: true
          install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Restore Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - name: Run fast verification
        env:
          TURBO_CACHE_MAX_AGE: 7d
        run: pnpm verify

  artifact-checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        command:
          - pnpm pack:check
          - pnpm git-install:check
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          runtime: node@22.19.0
          cache: true
          install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run artifact check
        run: ${{ matrix.command }}
