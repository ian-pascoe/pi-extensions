name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      native_only:
        description: Run only native managed-tool and preset verification
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NO_UPDATE_NOTIFIER: "1"
  # Avoid multiplying Vitest worker pools across packages on small runners.
  PNPM_CONFIG_WORKSPACE_CONCURRENCY: "1"

jobs:
  dap-native-payloads:
    name: Reproduce Windows preflight payloads
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pnpm and Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@22.19.0
          install: false
      - name: Install build-time tools
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o "$RUNNER_TEMP/zig.tar.xz"
          echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  $RUNNER_TEMP/zig.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install --yes llvm
      - name: Compare rebuilt bytes and inspect runtime imports
        run: node scripts/build-dap-native.mjs

  language-tools:
    if: github.event_name == 'workflow_dispatch'
    name: Managed tools (${{ matrix.os }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, os: linux, arch: x64 }
          - { runner: ubuntu-24.04-arm, os: linux, arch: arm64 }
          - { runner: macos-15-intel, os: darwin, arch: x64 }
          - { runner: macos-15, os: darwin, arch: arm64 }
          - { runner: windows-2025, os: win32, arch: x64 }
          - { runner: windows-11-arm, os: win32, arch: arm64 }
    env:
      PI_TOOL_INSTALLER_NATIVE: "1"
      EXPECTED_OS: ${{ matrix.os }}
      EXPECTED_ARCH: ${{ matrix.arch }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pnpm and Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@22.19.0
          cache: true
          install: false
      - name: Install native Go compiler for debug fixtures
        if: ${{ matrix.os != 'win32' || matrix.arch != 'arm64' }}
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.1"
          architecture: ${{ matrix.arch }}
          cache: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify native architecture and probe managed tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node -e "const a = require('node:assert/strict'); const os = require('node:os'); a.equal(process.platform, process.env.EXPECTED_OS); a.equal(process.arch, process.env.EXPECTED_ARCH); console.log(process.platform, process.arch, process.version, os.release(), os.version())"
          pnpm --dir packages/pi-tool-installer exec vitest run --config ../../vitest.config.ts --root . --maxWorkers=1 --reporter=verbose --disableConsoleIntercept
      - name: Verify runtime preflight ownership using shipped payloads
        if: ${{ !cancelled() }}
        run: >-
          pnpm --dir packages/pi-dap exec vitest run --config ../../vitest.config.ts --root .
          dap-runtime-probe.test.ts --maxWorkers=1 --reporter=verbose
      - name: Verify expanded native preset operations and safeguards
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PI_LSP_PRESETS_NATIVE: "1"
          PI_LSP_FRAMEWORK_NATIVE: "1"
          PI_FORMATTER_NATIVE: "1"
          PI_DAP_EXPANSION_NATIVE: "1"
        run: >-
          pnpm -r --no-bail
          --filter @ian-pascoe/pi-lsp --filter @ian-pascoe/pi-formatter --filter @ian-pascoe/pi-dap
          exec vitest run --config ../../vitest.config.ts --root . native.test.ts
          --maxWorkers=1 --reporter=verbose --disableConsoleIntercept
      - name: Verify package precedence, acquisition, and cancellation
        if: ${{ !cancelled() }}
        run: >-
          pnpm -r --no-bail
          --filter @ian-pascoe/pi-lsp --filter @ian-pascoe/pi-formatter --filter @ian-pascoe/pi-dap
          exec vitest run --config ../../vitest.config.ts --root . extension.test.ts --reporter=verbose

  verify:
    if: ${{ !inputs.native_only }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pnpm and Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@22.19.0
          cache: true
          install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run fast verification
        run: pnpm verify

  artifact-checks:
    if: ${{ !inputs.native_only }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        command:
          - pnpm pack:check
          - pnpm git-install:check
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pnpm and Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@22.19.0
          cache: true
          install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run artifact check
        run: ${{ matrix.command }}
