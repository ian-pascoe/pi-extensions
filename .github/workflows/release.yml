name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NO_UPDATE_NOTIFIER: "1"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install Node.js and Bun
        uses: jdx/mise-action@v5
      - name: Restore Bun package cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Restore Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - name: Run fast verification
        env:
          TURBO_CACHE_MAX_AGE: 7d
        run: bun run verify

  artifact-checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        command:
          - bun run pack:check
          - bun run git-install:check
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install Node.js and Bun
        uses: jdx/mise-action@v5
      - name: Install npm with trusted publishing support
        run: npm install --global npm@">=11.5.1"
      - name: Restore Bun package cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run artifact check
        run: ${{ matrix.command }}

  version:
    needs: [verify, artifact-checks]
    if: vars.NPM_PUBLISH_ENABLED != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install Node.js and Bun
        uses: jdx/mise-action@v5
      - name: Restore Bun package cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Create or update version pull request
        uses: changesets/action@v2.1.1
        with:
          version-script: bun run version-packages
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
          create-github-releases: true

  publish:
    needs: [verify, artifact-checks]
    if: vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    env:
      NPM_CONFIG_PROVENANCE: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install Node.js and Bun
        uses: jdx/mise-action@v5
      - name: Install npm with trusted publishing support
        run: npm install --global npm@">=11.5.1"
      - name: Restore Bun package cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Publish packages
        uses: changesets/action@v2.1.1
        with:
          publish-script: bun run publish-packages
          version-script: bun run version-packages
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
          create-github-releases: true
