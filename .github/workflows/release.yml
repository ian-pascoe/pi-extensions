name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NO_UPDATE_NOTIFIER: "1"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install Node.js, pnpm, and Vite+
        uses: jdx/mise-action@v5
      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Restore pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Restore Vite Task cache
        uses: actions/cache@v6
        with:
          path: node_modules/.vite/task-cache
          key: vp-task-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            vp-task-${{ runner.os }}-
      - name: Run fast verification
        run: vp run verify

  artifact-checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        command:
          - pnpm run pack:check
          - pnpm run git-install:check
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install Node.js, pnpm, and Vite+
        uses: jdx/mise-action@v5
      - name: Install npm with trusted publishing support
        run: npm install --global npm@">=11.5.1"
      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Restore pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run artifact check
        run: ${{ matrix.command }}

  version:
    needs: [verify, artifact-checks]
    if: vars.NPM_PUBLISH_ENABLED != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install Node.js, pnpm, and Vite+
        uses: jdx/mise-action@v5
      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Restore pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Create or update version pull request
        uses: changesets/action@v2.1.1
        with:
          version-script: pnpm run version-packages
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
          create-github-releases: true

  publish:
    needs: [verify, artifact-checks]
    if: vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    env:
      NPM_CONFIG_PROVENANCE: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install Node.js, pnpm, and Vite+
        uses: jdx/mise-action@v5
      - name: Install npm with trusted publishing support
        run: npm install --global npm@">=11.5.1"
      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Restore pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Publish packages
        uses: changesets/action@v2.1.1
        with:
          publish-script: pnpm run publish-packages
          version-script: pnpm run version-packages
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
          create-github-releases: true
