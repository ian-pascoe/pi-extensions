packages:
  - packages/*
  - tools/*
linkWorkspacePackages: true
# Pi 0.85.0's unbundled SDK imports pi-server without declaring it.
packageExtensions:
  "@earendil-works/pi-coding-agent@0.85.0":
    dependencies:
      "@earendil-works/pi-server": "0.85.0"
allowBuilds:
  "@google/genai": true
  deno: false
  esbuild: true
  protobufjs: true
  tesseract.js: true
  tree-sitter-bash: false
  zeromq: false
