packages:
  - packages/*
# Packages depend on each other through semver ranges such as `^0.13.0`, not `workspace:`, so the
# published manifests stay installable; link them to the workspace copies.
linkWorkspacePackages: true
allowBuilds:
  "@google/genai": true
  esbuild: true
  protobufjs: true
  tesseract.js: true
  tree-sitter-bash: false
  zeromq: false
# Vite+ provides Vite and Vitest. Concrete versions rather than a pnpm catalog: Pi installs this
# repository from Git with npm, which rejects `catalog:` specs. Upgrade them together; see ADR 0012.
overrides:
  vite@*: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vitest@*: 5.1.0
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
# Temporary: Vite+ 1.7.0 was installed inside pnpm's one-day release-age delay. Delete this list
# once it has passed (after 2026-11-18T03:35Z); see ADR 0012.
minimumReleaseAgeExclude:
  - "@voidzero-dev/vite-plus-core@8.3.8000"
  - "@voidzero-dev/vite-plus-darwin-arm64@1.7.0"
  - "@voidzero-dev/vite-plus-darwin-x64@1.7.0"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@1.7.0"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@1.7.0"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@1.7.0"
  - "@voidzero-dev/vite-plus-linux-x64-musl@1.7.0"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@1.7.0"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@1.7.0"
  - vite-plus@1.7.0
